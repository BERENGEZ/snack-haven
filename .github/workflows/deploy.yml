name: Deploy Snack Haven

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to Nginx Root
        run: |
          sudo rsync -av --delete ./ /var/www/snack-haven/
          sudo chown -R www-data:www-data /var/www/snack-haven
