<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Contact Us - Snack Haven</title>
  </head>
  <body>
    <header>
      <h1>Contact Snack Haven</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section id="contact">
        <h2>We’d love to hear from you!</h2>
        <form id="contactForm">
          <input type="text" placeholder="Your Name" required id="name" />
          <input type="email" placeholder="Your Email" required id="email" />
          <textarea
            placeholder="Your Message"
            rows="4"
            required
            id="message"
          ></textarea>
          <button type="submit">Send Message</button>
        </form>
        <p id="contact-response"></p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Snack Haven. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
